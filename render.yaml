services:
  - type: web
    name: tripwire
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    # One worker only: the scheduler lives in the web process, so more workers
    # would each poll every target and send every alert more than once. Threads
    # serve concurrent requests; the long timeout covers slow responses.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /healthz
    plan: starter
    disk:
      name: tripwire-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/tripwire.db
      - key: SECRET_KEY
        generateValue: true
      # Render generates the dashboard password on first deploy — read it from
      # the service's Environment tab. Replace it with your own at any time.
      - key: DASHBOARD_PASSWORD
        generateValue: true
      # Render terminates TLS and forwards the real client IP, so cookies can
      # be HTTPS-only and the login throttle can see per-client addresses.
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANALYST_EMAIL
        sync: false
      - key: MAX_CONCURRENT_CHECKS
        value: "2"
      - key: DEFAULT_CHECK_INTERVAL
        value: "15"
